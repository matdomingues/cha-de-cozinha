<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Confirmação</title>
</head>
<body style="margin:0;padding:0;background:#F2E5D5;font-family:Arial,Helvetica,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" style="padding:30px 0;">
<tr><td align="center">
<table width="600" cellpadding="0" cellspacing="0" style="background:#FFFDF9;border-radius:12px;overflow:hidden;box-shadow:0 4px 20px rgba(66,63,51,.12);">
<tr><td style="background:#6F7A56;padding:30px;text-align:center;">
<h1 style="margin:0;color:#FFFDF9;font-size:26px;">🌿 Nova Confirmação de Presença</h1>
<p style="margin:10px 0 0;color:#F2E5D5;font-size:15px;">Chá de Panela — Fernanda &amp; Matheus</p>
</td></tr>
<tr><td style="padding:30px;">
<table width="100%" cellpadding="10" cellspacing="0" style="border-collapse:collapse;">
<tr>
  <td style="font-weight:bold;color:#6F7A56;width:170px;border-bottom:1px solid #F2E5D5;">Nome</td>
  <td style="color:#423F33;border-bottom:1px solid #F2E5D5;">{{guest_name}}</td>
</tr>
<tr>
  <td style="font-weight:bold;color:#6F7A56;border-bottom:1px solid #F2E5D5;">Quantidade de pessoas</td>
  <td style="color:#423F33;border-bottom:1px solid #F2E5D5;">{{guest_count}}</td>
</tr>
<tr>
  <td style="font-weight:bold;color:#6F7A56;border-bottom:1px solid #F2E5D5;">Mensagem</td>
  <td style="color:#423F33;border-bottom:1px solid #F2E5D5;">{{guest_message}}</td>
</tr>
<tr>
  <td style="font-weight:bold;color:#6F7A56;border-bottom:1px solid #F2E5D5;">Presente escolhido</td>
  <td style="color:#423F33;border-bottom:1px solid #F2E5D5;">{{gift_choice}}</td>
</tr>
<tr>
  <td style="font-weight:bold;color:#6F7A56;">Confirmado em</td>
  <td style="color:#423F33;">{{submitted_at}}</td>
</tr>
</table>
</td></tr>
<tr><td style="background:#F2E5D5;padding:18px;text-align:center;font-size:12.5px;color:#6F7A56;">
Enviado automaticamente pelo site do chá de panela.
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
